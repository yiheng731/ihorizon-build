schema = 1
id = "reimagined_plus"
name = "Reimagined+"
version = "0.3.0"
api = "0.1"
description = "Sun, sky and torch colours with soft shadows, waving plants and weather, written for Horizon's shader API."
authors = ["ihorizon"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Sky"
sun = false
clouds = false

[material]
file = "material.wgsl"
name = "Lighting and shadows"
fog = false

[vertex]
file = "vertex.wgsl"

[weather]
file = "weather.wgsl"

[shadow]
resolution = 2048
distance = 160.0
solid_materials = [1]
option = "shadows"
resolution_option = "shadow_resolution"

[reflection]
option = "water_reflections"

[[materials]]
id = 1
sprites = ["block/*_leaves", "block/vine", "block/*_wart_block"]

[[materials]]
id = 2
sprites = [
    "block/short_grass",
    "block/grass",
    "block/fern",
    "block/large_fern_*",
    "block/tall_grass_*",
    "block/dandelion",
    "block/poppy",
    "block/*_tulip",
    "block/oxeye_daisy",
    "block/cornflower",
    "block/allium",
    "block/azure_bluet",
    "block/blue_orchid",
    "block/lily_of_the_valley",
    "block/dead_bush",
    "block/*_sapling",
    "block/wheat_stage*",
    "block/carrots_stage*",
    "block/potatoes_stage*",
    "block/beetroots_stage*",
    "block/sugar_cane",
]

[[options]]
id = "sky_brightness"
name = "Sky brightness"
type = "float"
default = 1.0
min = 0.4
max = 1.8
step = 0.05

[[options]]
id = "sunset_strength"
name = "Sunset colour"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "night_brightness"
name = "Night brightness"
type = "float"
default = 1.0
min = 0.2
max = 2.0
step = 0.05

[[options]]
id = "ambient_tint"
name = "Cool ambient"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "torch_warmth"
name = "Torch warmth"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "shadows"
name = "Shadows"
type = "bool"
default = true

[[options]]
id = "shadow_resolution"
name = "Shadow resolution"
type = "choice"
default = "2048"
values = ["1024", "2048", "4096"]

[[options]]
id = "shadow_softness"
name = "Shadow softness"
type = "float"
default = 1.0
min = 0.0
max = 3.0
step = 0.1

[[options]]
id = "water_reflections"
name = "Water reflections"
type = "bool"
default = false

[[options]]
id = "waving_plants"
name = "Waving plants"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "rain_darken"
name = "Weather darkening"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "bloom_strength"
name = "Bloom"
type = "float"
default = 0.35
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "bloom_threshold"
name = "Bloom threshold"
type = "float"
default = 0.75
min = 0.3
max = 1.5
step = 0.05

[[options]]
id = "exposure"
name = "Exposure"
type = "float"
default = 1.0
min = 0.4
max = 2.0
step = 0.05

[[options]]
id = "saturation"
name = "Saturation"
type = "float"
default = 1.05
min = 0.5
max = 1.6
step = 0.05

[[options]]
id = "contrast"
name = "Contrast"
type = "float"
default = 1.05
min = 0.7
max = 1.5
step = 0.05

[[options]]
id = "vignette"
name = "Vignette"
type = "bool"
default = true

[[post]]
file = "post/bloom.wgsl"
name = "Bloom"

[[post]]
file = "post/grade.wgsl"
name = "Grade and tonemap"

[budget]
gpu_ms = 2.0
