name: Horizon

options:
  bundleIdPrefix: dev.horizon
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    LIBRARY_SEARCH_PATHS:
      - $(SRCROOT)/libs
      - $(SRCROOT)/target/aarch64-apple-ios/release
    OTHER_LDFLAGS:
      - -lhorizon_client_ios
      - -framework
      - Metal
      - -framework
      - QuartzCore
      - -framework
      - UIKit
      - -framework
      - CoreGraphics
      - -framework
      - Foundation
      - -framework
      - CoreFoundation
      - -framework
      - IOSurface
      - -framework
      - CoreVideo
      - -framework
      - CoreText
      - -framework
      - CoreMedia
      - -framework
      - AudioToolbox
      - -framework
      - AVFoundation
      - -framework
      - GameController
      - -framework
      - UniformTypeIdentifiers
      - -lz
      - -lc++
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    VALIDATE_WORKSPACE: NO
    SWIFT_OBJC_BRIDGING_HEADER: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""

targets:
  Horizon:
    type: application
    platform: iOS
    sources:
      - path: Horizon
    settings:
      base:
        PRODUCT_NAME: ihorizon
        PRODUCT_BUNDLE_IDENTIFIER: dev.horizon.client
        INFOPLIST_FILE: Horizon/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        SWIFT_OPTIMIZATION_LEVEL: -O
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/Frameworks"
          - /usr/lib/swift
