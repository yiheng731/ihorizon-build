[package]
name = "horizon-ios-shell"
version = "0.1.0"
edition = "2024"
publish = false
description = "iOS host shell for Horizon: CAMetalLayer -> wgpu Metal surface, frame pump and touch sink."

[lib]
name = "horizon_ios_shell"
crate-type = ["staticlib", "rlib"]

[dependencies]
# 必须与 crates/horizon-client/Cargo.toml 里的 wgpu 版本保持一致。
wgpu = { version = "30.0.1", default-features = false, features = [
    "std",
    "metal",
    "wgsl",
    "naga-ir",
] }

[features]
# 打开后由真实 Horizon 客户端接管渲染；默认只画一个清屏三角形，用来证明 Metal 通路。
horizon = []
