[package]
name = "horizon-ios-shell"
version = "0.1.0"
edition = "2024"
publish = false
description = "iOS host shell for Horizon: CAMetalLayer -> wgpu Metal surface, frame pump and touch sink."

[lib]
name = "horizon_ios_shell"
crate-type = ["staticlib", "rlib"]

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = [
    "std",
    "metal",
    "wgsl",
    "naga-ir",
] }

[features]
horizon = []
